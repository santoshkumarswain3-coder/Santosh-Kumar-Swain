name: Build BrightQuiz APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Android SDK & Licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platform-tools" "build-tools;36.0.0" || true
            "$SDKMANAGER" "platforms;android-36.1" || "$SDKMANAGER" "platforms;android-36" || true
          fi

      - name: Prepare debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > debug.keystore
            echo "Restored debug.keystore from DEBUG_KEYSTORE_BASE64 secret."
          elif [ -f debug.keystore.base64 ]; then
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore
            echo "Restored debug.keystore from debug.keystore.base64 file."
          else
            echo "::error::Missing debug.keystore.base64! Add GitHub Actions secret DEBUG_KEYSTORE_BASE64 (copy contents of debug.keystore.base64 from AI Studio) in Repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Install Gradle 9.3.1
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o /tmp/gradle-9.3.1.zip
          mkdir -p "$HOME/gradle"
          unzip -q -o /tmp/gradle-9.3.1.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-9.3.1/bin" >> "$GITHUB_PATH"

      - name: Restore google-services.json from secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            python3 - <<'PY'
          import base64, json, os, sys
          raw = os.environ["GOOGLE_SERVICES_JSON"].lstrip("\ufeff").strip()
          if not raw.startswith("{"):
              try:
                  decoded = base64.b64decode(raw, validate=True).decode("utf-8").lstrip("\ufeff").strip()
                  if decoded.startswith("{"):
                      raw = decoded
              except Exception:
                  pass
          try:
              data = json.loads(raw)
          except json.JSONDecodeError as e:
              print(f"::error::GOOGLE_SERVICES_JSON secret has invalid JSON at line {e.lineno}, column {e.colno}: {e.msg}. Re-copy the entire app/google-services.json file (must start with '{{' and end with '}}').")
              sys.exit(1)
          if "project_info" not in data or "client" not in data:
              print("::error::GOOGLE_SERVICES_JSON does not look like a Firebase google-services.json file (missing project_info/client).")
              sys.exit(1)
          with open("app/google-services.json", "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
          print("Restored valid app/google-services.json")
          PY
          elif [ ! -f app/google-services.json ]; then
            echo "::error::Missing app/google-services.json. Add GitHub Actions secret GOOGLE_SERVICES_JSON (copy contents of app/google-services.json from AI Studio) in Repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Verify keystore SHA-1 matches google-services.json
        run: |
          ACTUAL_SHA1="$(keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android | awk -F'SHA1: ' '/SHA1:/{print $2}' | tr -d ': \r\n' | tr '[:upper:]' '[:lower:]')"
          echo "Keystore SHA1: $ACTUAL_SHA1"
          if ! grep -qi "$ACTUAL_SHA1" app/google-services.json; then
            echo "::error::Keystore SHA-1 ($ACTUAL_SHA1) does not match app/google-services.json! Make sure DEBUG_KEYSTORE_BASE64 and GOOGLE_SERVICES_JSON secrets both come from this AI Studio project."
            exit 1
          fi
          echo "SHA-1 verified against app/google-services.json!"

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload BrightQuiz APK
        uses: actions/upload-artifact@v4
        with:
          name: BrightQuiz-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
